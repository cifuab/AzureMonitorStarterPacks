name: Validate Packs Definition

on:
  pull_request:
    paths:
      - 'Packs/PacksDef.json'
      - 'Packs/PacksDef.schema.json'
      - 'tools/Validate-PacksDef.ps1'
  push:
    paths:
      - 'Packs/PacksDef.json'
      - 'Packs/PacksDef.schema.json'
      - 'tools/Validate-PacksDef.ps1'

jobs:
  validate-packs:
    name: Validate PacksDef.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate PacksDef.json against schema
        shell: pwsh
        run: ./tools/Validate-PacksDef.ps1
